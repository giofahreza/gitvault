name: Release Tag Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build Android APKs
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate model code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Derive release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or 1.2.3"
            exit 1
          fi
          BUILD_NUMBER="$(echo "$VERSION" | awk -F. '{ print ($1 * 1000000) + ($2 * 1000) + $3 }')"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Configure Android signing (if secrets exist)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Android signing mode
        run: |
          if [ -f android/key.properties ]; then
            echo "Release signing configured from repository secrets."
          else
            echo "::warning::Android signing secrets are not configured. Falling back to debug signing (as defined in android/app/build.gradle.kts)."
          fi

      - name: Build universal APK
        run: |
          flutter build apk --release --no-shrink \
            --build-name "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --dart-define "GITVAULT_VERSION=$RELEASE_VERSION" \
            --dart-define "GITVAULT_BUILD_NUMBER=$RELEASE_BUILD_NUMBER"

      - name: Prepare universal artifact
        run: |
          mkdir -p release-artifacts
          TAG="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/gitvault-${TAG}-universal.apk"

      - name: Build ABI-specific APKs
        run: |
          flutter build apk --release --split-per-abi --no-shrink \
            --build-name "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --dart-define "GITVAULT_VERSION=$RELEASE_VERSION" \
            --dart-define "GITVAULT_BUILD_NUMBER=$RELEASE_BUILD_NUMBER"

      - name: Prepare ABI artifacts + checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/app-(.*)-release.apk/\1/')"
            cp "$apk" "release-artifacts/gitvault-${TAG}-${abi}.apk"
          done
          (cd release-artifacts && sha256sum -- *.apk > SHA256SUMS.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  desktop-release:
    name: Build ${{ matrix.label }} Desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            label: Linux
          - os: windows-2022
            platform: windows
            label: Windows
          - os: macos-14
            platform: macos
            label: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          cache: true

      - name: Enable desktop platform
        shell: bash
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate model code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Derive release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or 1.2.3"
            exit 1
          fi
          BUILD_NUMBER="$(echo "$VERSION" | awk -F. '{ print ($1 * 1000000) + ($2 * 1000) + $3 }')"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Run MCP tests
        run: flutter test test/mcp

      - name: Build desktop app
        shell: bash
        run: >-
          flutter build ${{ matrix.platform }} --release
          --build-name "$RELEASE_VERSION"
          --build-number "$RELEASE_BUILD_NUMBER"
          --dart-define "GITVAULT_VERSION=$RELEASE_VERSION"
          --dart-define "GITVAULT_BUILD_NUMBER=$RELEASE_BUILD_NUMBER"

      - name: Compile and bundle Linux stdio bridge
        if: runner.os == 'Linux'
        run: dart compile exe bin/gitvault_mcp.dart -o build/linux/x64/release/bundle/gitvault_mcp

      - name: Compile and bundle Windows stdio bridge
        if: runner.os == 'Windows'
        run: dart compile exe bin/gitvault_mcp.dart -o build/windows/x64/runner/Release/gitvault_mcp.exe

      - name: Compile and bundle macOS stdio bridge
        if: runner.os == 'macOS'
        run: dart compile exe bin/gitvault_mcp.dart -o build/macos/Build/Products/Release/gitvault.app/Contents/MacOS/gitvault_mcp

      - name: Validate Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x build/linux/x64/release/bundle/gitvault
          test -x build/linux/x64/release/bundle/gitvault_mcp
          test -f build/linux/x64/release/bundle/lib/libflutter_linux_gtk.so
          test -d build/linux/x64/release/bundle/data/flutter_assets

      - name: Validate Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = @(
            "build/windows/x64/runner/Release/gitvault.exe",
            "build/windows/x64/runner/Release/gitvault_mcp.exe",
            "build/windows/x64/runner/Release/flutter_windows.dll",
            "build/windows/x64/runner/Release/data/flutter_assets"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required Windows release path: $path"
            }
          }

      - name: Validate macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -x build/macos/Build/Products/Release/gitvault.app/Contents/MacOS/gitvault
          test -x build/macos/Build/Products/Release/gitvault.app/Contents/MacOS/gitvault_mcp
          test -d build/macos/Build/Products/Release/gitvault.app/Contents/Frameworks
          test -f build/macos/Build/Products/Release/gitvault.app/Contents/Info.plist

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-artifacts
          tar -C build/linux/x64/release -czf \
            "release-artifacts/gitvault-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            bundle
          (cd release-artifacts && sha256sum -- *.tar.gz > SHA256SUMS-linux.txt)

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $archive = "release-artifacts/gitvault-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "release-artifacts/SHA256SUMS-windows.txt"

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/gitvault.app \
            "release-artifacts/gitvault-${GITHUB_REF_NAME}-macos.zip"
          (cd release-artifacts && shasum -a 256 -- *.zip > SHA256SUMS-macos.txt)

      - name: Upload desktop workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitvault-${{ github.ref_name }}-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs:
      - android-release
      - desktop-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.ref_name }}*"
          path: release-artifacts
          merge-multiple: true

      - name: Verify complete release asset set
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          required=(
            "gitvault-${TAG}-universal.apk"
            "gitvault-${TAG}-armeabi-v7a.apk"
            "gitvault-${TAG}-arm64-v8a.apk"
            "gitvault-${TAG}-x86_64.apk"
            "gitvault-${TAG}-linux-x64.tar.gz"
            "gitvault-${TAG}-windows-x64.zip"
            "gitvault-${TAG}-macos.zip"
            "SHA256SUMS.txt"
            "SHA256SUMS-linux.txt"
            "SHA256SUMS-windows.txt"
            "SHA256SUMS-macos.txt"
          )
          for asset in "${required[@]}"; do
            test -s "release-artifacts/$asset" || {
              echo "::error::Missing or empty release asset: $asset"
              exit 1
            }
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release-artifacts/*

  deploy-web:
    name: Build + Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          cache: true

      - name: Enable web support
        run: flutter config --enable-web

      - name: Ensure web platform exists
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web .
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate model code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Derive release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or 1.2.3"
            exit 1
          fi
          BUILD_NUMBER="$(echo "$VERSION" | awk -F. '{ print ($1 * 1000000) + ($2 * 1000) + $3 }')"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build Flutter web
        run: |
          flutter build web --release --base-href "/app/" \
            --pwa-strategy=none \
            --dart-define "GITVAULT_VERSION=$RELEASE_VERSION" \
            --dart-define "GITVAULT_BUILD_NUMBER=$RELEASE_BUILD_NUMBER"

      - name: Verify compiled web version
        run: |
          if ! grep -R "$RELEASE_VERSION" build/web >/dev/null; then
            echo "::error::Compiled web bundle does not contain release version $RELEASE_VERSION"
            exit 1
          fi

      - name: Render docs site
        run: node scripts/render_docs_site.mjs

      - name: Prepare GitHub Pages site
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist/app
          cp -R docs/. pages-dist/
          cp -R build/web/. pages-dist/app/
          cat > pages-dist/app/version.json <<EOF
          {"app_name":"gitvault","version":"$RELEASE_VERSION","build_number":"$RELEASE_BUILD_NUMBER","package_name":"gitvault"}
          EOF
          mkdir -p pages-dist/screenshots pages-dist/assets/icon
          cp -R screenshots/. pages-dist/screenshots/
          cp assets/icon/gitvault_new.jpeg pages-dist/assets/icon/gitvault_new.jpeg
          cp build/web/index.html pages-dist/app/404.html
          cat > pages-dist/app/flutter_service_worker.js <<'EOF'
          self.addEventListener('install', (event) => {
            self.skipWaiting();
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              if (self.caches) {
                const keys = await caches.keys();
                await Promise.all(keys.map((key) => caches.delete(key)));
              }
              await self.clients.claim();
              await self.registration.unregister();
              const clients = await self.clients.matchAll({ type: 'window' });
              for (const client of clients) {
                client.navigate(client.url);
              }
            })());
          });
          EOF
          touch pages-dist/.nojekyll
          test -f pages-dist/CNAME
          test -f pages-dist/index.html
          test -f pages-dist/wiki.html
          test -f pages-dist/docs/index.html
          test -f pages-dist/docs/quick-start/index.html
          test -f pages-dist/docs/github-sync/index.html
          test -f pages-dist/docs/platform-support/index.html
          test -f pages-dist/docs/sync-behavior/index.html
          test -f pages-dist/docs/passwords/index.html
          test -f pages-dist/docs/notes/index.html
          test -f pages-dist/docs/ai-apps/index.html
          test -f pages-dist/docs/totp/index.html
          test -f pages-dist/docs/totp-import/index.html
          test -f pages-dist/docs/ssh/index.html
          test -f pages-dist/docs/autofill-keyboard/index.html
          test -f pages-dist/docs/security/index.html
          test -f pages-dist/docs/settings/index.html
          test -f pages-dist/docs/devices/index.html
          test -f pages-dist/docs/recovery/index.html
          test -f pages-dist/docs/install-update/index.html
          test -f pages-dist/docs/release-verification/index.html
          test -f pages-dist/docs/faq/index.html
          test -f pages-dist/docs/troubleshooting/index.html
          test -f pages-dist/docs/category/tutorials/index.html
          test -f pages-dist/docs/search-index.json
          test -f pages-dist/docs.css
          test -f pages-dist/docs.js
          test -f pages-dist/app/index.html
          grep -q '<base href="/app/">' pages-dist/app/index.html
          grep -q '<base href="/app/">' pages-dist/app/404.html
          grep -q "\"version\":\"$RELEASE_VERSION\"" pages-dist/app/version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
