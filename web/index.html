<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Secure, device-centric password manager using GitHub sync.">
  <meta name="theme-color" content="#F7EFEA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#180D0E" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GitVault">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=129">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png?v=129"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=129"/>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=129"/>

  <title>GitVault</title>
  <link rel="manifest" href="manifest.json?v=129">
  <style>
    :root {
      color-scheme: light dark;
      background: #f7efea;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7efea;
    }

    #gitvault-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #fffaf7;
      color: #6d221f;
      opacity: 1;
      transition: opacity 180ms ease-out;
    }

    .gitvault-loader__content {
      display: grid;
      justify-items: center;
      gap: 14px;
      color: #2c1718;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .gitvault-loader__mark {
      width: 30px;
      height: 30px;
      color: #6d221f;
    }

    .gitvault-loader__label {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .gitvault-loader__rail {
      width: 96px;
      height: 2px;
      overflow: hidden;
      background: #ecd8cf;
    }

    .gitvault-loader__rail::after {
      display: block;
      width: 42%;
      height: 100%;
      content: "";
      background: #ed735a;
      animation: gitvault-loader-progress 1100ms ease-in-out infinite;
    }

    .gitvault-loader--hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes gitvault-loader-progress {
      from { transform: translateX(-100%); }
      to { transform: translateX(240%); }
    }

    @media (prefers-color-scheme: dark) {
      :root,
      body,
      #gitvault-loader {
        background: #180d0e;
      }

      .gitvault-loader__content {
        color: #fff;
      }

      .gitvault-loader__mark {
        color: #ed735a;
      }

      .gitvault-loader__rail {
        background: #442825;
      }

      .gitvault-loader__rail::after {
        background: #ed735a;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #gitvault-loader {
        transition: none;
      }

      .gitvault-loader__rail::after {
        animation: none;
        transform: translateX(80%);
      }
    }
  </style>
</head>
<body>
  <div id="gitvault-loader" role="status" aria-label="Opening GitVault">
    <div class="gitvault-loader__content">
      <svg class="gitvault-loader__mark" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-5 7a1.5 1.5 0 1 1 1.5-1.5A1.5 1.5 0 0 1 12 15Zm2-7h-4V6a2 2 0 0 1 4 0v2Z"/>
      </svg>
      <span class="gitvault-loader__label">Opening GitVault</span>
      <span class="gitvault-loader__rail" aria-hidden="true"></span>
    </div>
  </div>
  <script>
    (() => {
      const clearOldFlutterCaches = async () => {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations
              .filter((registration) => registration.scope.includes(`${location.origin}/app/`))
              .map((registration) => registration.unregister())
          );
        }

        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(
            keys
              .filter((key) => key.startsWith("flutter-app-cache") || key.includes("gitvault"))
              .map((key) => caches.delete(key))
          );
        }
      };

      window.addEventListener("load", () => {
        clearOldFlutterCaches().catch(() => {});
      });
    })();
  </script>
  <script>
    (() => {
      const loader = document.getElementById("gitvault-loader");
      if (!loader) return;

      window.addEventListener("flutter-first-frame", () => {
        loader.classList.add("gitvault-loader--hidden");
        window.setTimeout(() => loader.remove(), 180);
      }, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
